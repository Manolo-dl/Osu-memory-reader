[package]
name = "osu-memory-reader"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Reads live data from a running osu! stable process: beatmap and its files, game state, gameplay, results, leaderboard, user, settings and tournament clients"
license = "LGPL-3.0-only"
authors = ["Manolo-dl"]
repository = "https://github.com/Manolo-dl/Osu-memory-reader"
readme = "README.md"
keywords = ["osu", "memory", "reader", "gamedev"]
categories = ["games", "os"]

[features]
## Derives `Serialize`/`Deserialize` on the public data types (camelCase fields).
serde = ["dep:serde"]
## Star rating, BPM, original mode and key count from the `.osu` file (pulls in rosu-pp).
difficulty = ["dep:rosu-pp"]

[dependencies]
memchr = "2.8"
rosu-pp = { version = "4.0.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1.0.154"

[package.metadata.docs.rs]
all-features = true
